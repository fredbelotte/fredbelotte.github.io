<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>fred belotte</title>

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body id="app">
    <header></header>

    <main>
      <section class="hero is-fullheight">
        <div class="hero-body">
          <div class="">
            <p class="title is-1">fred belotte</p>
            <p class="subtitle is-3">software engineer</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <nav class="level">
        <div class=""></div>

        <div class="level-right">
          <p class="level-item has-text-centered">
            <a
              class="button"
              :href="socialNetworks[0].url"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="icon-text">
                <span class="icon">
                  <i :class="socialNetworks[0].icon"></i>
                </span>
                <span>{{socialNetworks[0].text}}</span>
              </span>
            </a>
          </p>

          <p class="level-item has-text-centered">
            <a
              class="button"
              :href="socialNetworks[1].url"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="icon-text">
                <span class="icon">
                  <i :class="socialNetworks[1].icon"></i>
                </span>
                <span>{{socialNetworks[1].text}}</span>
              </span>
            </a>
          </p>
        </div>
      </nav>

      <div class="content has-text-centered">
        <p><small>Copyright &copy; 2024 fred belotte</small></p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/js/all.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
